[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-icing-risk"
version = "0.1.0"
description = "KISTI 2026 Jeonbuk highway road icing risk analysis research scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "scikit-learn>=1.3,<2.0",
  "pyarrow>=12",
  "PyYAML>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
geo = ["geopandas>=0.14", "shapely>=2", "pyproj>=3"]
boost = ["catboost>=1.2", "lightgbm>=4"]

[project.scripts]
road-icing = "road_icing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
